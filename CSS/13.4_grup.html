<!DOCTYPE html>
<html>
    <head>
        <style>
            h1,h2{/*birdan fazla elemente uyguladik*/
                color: brown;
            }
            h1 u{/*h2 icindeki u etiketine uyguladik*/
                color: aqua;
            }
            p #kelimeid{/*p icindeki id secimi*/
                color: blue;
            }
            p.egik{/*p icinde class egik olan element*/
                font-style: italic;
                color: green;
            }
        </style>
    </head>

    <body>
    <h1><u>Egitim</u> Bilgileri</h1>
    <h2>Temel <u>okuma</u> Egitimi</h2>
    <p class="egik">kitap</p>
    <p>defter</p>
    <p>kalem</p>

    <h2>Ileri seviye</h2>
    <p>1.</p>
    <p>2.</p>
    <p>3. <span id="kelimeid">kelime</span>  deneme</p>
    </body>
</html>
