<!DOCTYPE html>
<html>
    <head>
        <style>
            #sayfa{
                border-style: solid;
                width: 300px;
                margin: auto;
                background-color: chocolate;
            }
            header{
                border-style: dotted;
                border-color: brown;
                background-color: lightblue;
                width: 280px;
                height: 50px;
                text-align: center;
                margin: auto;
            }
            nav{
                border-style: dashed;
                border-color: brown;
                background-color: lightgreen;
                width: 280px;
                height: 30px;
                text-align: center;
                margin: auto;
            }
            article{
                border-style: double;
                border-color: blue;
                background-color: lightyellow;
                width: 280px;
                min-height: 200px;
                text-align: center;
                margin: auto;
            }
            footer{
                border-style: groove;
                border-color: brown;
                background-color: lightgray;
                width: 280px;
                height: 40px;
                text-align: center;
                margin: auto;
            }
        </style>
    </head>
    <body>
        <div id="sayfa">
        <header>
            Buraya logo ve reklam gelecek
        </header>
        <nav>
            Buraya ana menü gelecek
        </nav>
        <article>
            Burasi icerik alani
        </article>
        <footer>
            Buraya iletisim bilgileri gelecek
        </footer>
        </div>
    </body>
</html>
