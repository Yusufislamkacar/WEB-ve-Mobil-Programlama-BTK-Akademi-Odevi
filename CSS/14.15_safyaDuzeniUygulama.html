<!DOCTYPE html>
<html>
    <head>
        <style>
            #sayfa{
                border-color: indianred;
                border-style: solid;
                border-width: 5px;
                width: 400px;
                min-height: 300px;
                margin: auto;
                background-color: lightgray;
            }
            header{
                border-style: dotted;
                border-color: blue;
                background-color: lightblue;
                width: 380p;
                height: 50px;
                text-align: center;
                margin: auto;
            }
            nav{
                border-style: dashed;
                border-color: brown;
                background-color: lightgreen;
                width: 380px;
                height: 30px;
                text-align: center;
                margin: auto;
            }
            article{
                border-style: double;
                border-color: blue;
                background-color: lightyellow;
                width: 200px;
                min-height: 200px;
                text-align: center;
                margin: left;
                float: left;
                position: relative;
                left: 20px;
                
            }
            aside{
                border-style: groove;
                border-color: brown;
                background-color: lightgray;
                width: 160px;
                height: 200px;
                text-align: center;
                margin: auto;
                float: right;
                position: relative;
                right: 20px;
            }
            footer{
                border-style: inset;
                border-color: brown;
                background-color: lightgray;
                width: 380px;
                height: 40px;
                text-align: center;
                margin: auto;
                clear: both;
            }
        </style>
    </head>
     <body>
        <div id="sayfa">
            <header>
                Buraya logo gelecek
            </header>
            <nav>
                Buraya ana menü gelecek
            </nav>
            <article>
                Burasi icerik alani
            </article>
            <aside>
                Buraya yan menu gelecek
            </aside>
            <footer>
                Buraya footer gelecek
        </div>
    </body>
</html>
