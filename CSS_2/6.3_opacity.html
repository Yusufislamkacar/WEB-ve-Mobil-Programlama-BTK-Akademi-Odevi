<!DOCTYPE html>
<html>
    <head>
        <title>CSS ogreniyorum :)</title>
        <style>
            #box{
                height: 200px;
                width: 300px;
                border: green solid 5px;
                background-color: chocolate;
            }
            #bayrak{
                height: 100px;
                width: 150px;
                position: relative;
                left: 50px;
                top: -50px;
                opacity: 0.5;/*opakligini degistirdik.*/
            }
            #bayrak:hover{
                opacity: 1;
            }
        </style>
    </head>
    <body>
        <div id="box">
            box
        </div>
        <img id="bayrak" src="../turk-bayragi.jpg">
    </body>
</html>
