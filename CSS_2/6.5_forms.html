<!DOCTYPE html>
<html>
    <head>
        <title>CSS ogreniyorum :)</title>
        <style>
            #form{
                border: darkorchid solid 2px;
                border-radius: 10px;
                padding: 20px;
                background-color: blue;
            }
            body{
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                color: violet;
                font-weight: bold;
            }

            input{
                border: darkgoldenrod dashed 2px;
                color: cyan;
                padding: 5px;
                margin: 6px;
                background-color: brownf;
            }

            input:focus{
                background-color: powderblue;
            }
        </style>
    </head>
    <body>
        <div id="form">
            <form>
                <table>
                    <tr>
                       <tr><td>Name Surtname</td> <td><input type="text"></td></tr> 
                       <tr><td>Age</td> <td><input type="number"></td></tr> 
                       <tr><td></td> <td><input type="submit"><input type="reset"></td></tr> 
                    </tr>
                </table>
            </form>
        </div>
    </body>
</html>
