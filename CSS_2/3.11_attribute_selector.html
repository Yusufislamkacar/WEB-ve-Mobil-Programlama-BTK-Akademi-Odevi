<!DOCTYPE html>
<html>
    <head>
        <title>CSS ogreniyorum :)</title>
        <style>
            input[type="text"]{
                background-color: pink; /*tum input elemanlari pembe yap*/
            }

            input[type="text"]:focus{/*yanlizca text olarak ayarlanmis ozellikteki elementleri secer.*/
                background-color: powderblue;/*tiklayica rengi degisir.*/
            }


        </style>
    </head>
    <body>
        <form>
            Ad Soyad: <input type="text"> <br>
            Yas: <input type="number"> <br>
            <input type="submit"><input type="reset">
        </form>
    </body>
</html>
