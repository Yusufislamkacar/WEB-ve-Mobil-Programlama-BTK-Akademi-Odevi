<!DOCTYPE html>
<html>
    <head>
        <title>CSS ogreniyorum :)</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            *{
                box-sizing: border-box;
                padding: 0px;
                margin: 0px;
            }

            .col-1{width: 8.33%;}/*sayfayi 12 stuna bolduk*/
            .col-2{width: 16.66%;}
            .col-3{width: 25%;}
            .col-4{width: 33.33%;}
            .col-5{width: 41.66%;}
            .col-6{width: 50%;}
            .col-7{width: 58.33%;}
            .col-8{width: 66.66%;}
            .col-9{width: 75%;}
            .col-10{width: 83.33%;}
            .col-11{width: 91.66%;}
            .col-12{width: 100%;}

            [class*="col-"]{/*col- sinifi uygulanmis html elemanlarini sec*/
                float: left;
                padding: 1px;
                border: red solid 1px;
            }

            .row::after{/*row classi uygulanmis elemanlarin sonraki elemani sec*/
                content: "";/*icini temizle*/
                clear: both;/*float komutu uygulanmissa temizle*/
                display: table;/*tablo gibi goster.*/
            }
            /*768 pikselden kucuk ekranda kutu genisligi %100 olsun*/
            @media only screen and (max-width: 768px){
                [class*="col-"] {
                    width: 100%;
                }/*col- ile baslayan classlari sec*/
            }
            img{
                width: 100%;
                height: auto;
            }
        </style>
    </head>
    <body>
        <div id="row1" class="row">
            <div id="logo" class="col-2">
                <img src="../turk-bayragi.jpg">
            </div>
            <div id="mainmenu" class="col-10">
                Main Menu
            </div>
        </div>
        <div id="row2" class="row">
            <div id="contents" class="col-9">
                contents
            </div>
            <div id="sidemenu" class="col-3">
                Side Menu
            </div>
        </div>
        <div id="row3" class="row">
            <div id="footleft" class="col-4">
                Left Footer
            </div>
            <div id="footcenter" class="col-4">
                Center Footer
            </div>
            <div id="footright" class="col-4">
                Right Footer
            </div>
        </div>
    </body>
</html>
