<!DOCTYPE html>
<html>
    <head>
        <title>CSS ogreniyorum :)</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            img{
                width: 300px;
                height: 100px;
                border: green solid;
                object-fit: cover;/*none, fill, contain ve cover parametreleri vardir.*/
            }
            @media screen and (max-width:400px){
                body{
                    background-color: yellow;/*400 pikselden kucuk bir ekranda arkaplan sari oldu. */
                }
                img{
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <img src="../turk-bayragi.jpg">
    </body>
</html>
