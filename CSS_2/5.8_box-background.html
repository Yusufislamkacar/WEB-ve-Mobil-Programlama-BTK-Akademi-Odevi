<!DOCTYPE html>
<html>
    <head>
        <title>CSS ogreniyorum :)</title>
        <style>

            #box{
                border-style: solid;
                border-color: blue;
                width: 200px;/*alttakiyle ayni piksel boyutunda ayarladndi*/
                border-width: 20px;/*20 sagdan 20 soldan 40 piksel artti. 240 oldu.*/
                padding: 20px;/*sagdan 20 soldan 20 40 daha artti. 280 oldu.*/
                background-color: darkblue;/*Yeni ozellik. bu kutunun rengidir*/
            }
            #box2{
                color: white;
                border-style: dotted;
                border-color: red;
                width: 200px;
                height: 300px;
                background-image: url(../turk-bayragi.jpg);
                background-size: 100px;/*fotografi yeniden boyutlandirdim.*/
                background-repeat: no-repeat;
                background-position-x: center;
                background-position-y: center;
                background-attachment: scroll;/*sayfa assagisina indikci fotografin verecegi tepkiyi belirler.*/
            }
            *{
                box-sizing: border-box;
            }/*kutunun genisligini sabit tutmak icin bu evrensel metod kullanilabilir.*/
        </style>
    </head>
    <body>
        <div id="box">
            if you want to learn what margin is and how we can edit it, use this box.
            use this box
            use this box
            use this box
            use this box
        </div>
          <div id="box2">

        </div>
        
    </body>
</html>
