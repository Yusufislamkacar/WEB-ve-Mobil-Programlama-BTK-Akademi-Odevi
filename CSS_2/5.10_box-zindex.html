<!DOCTYPE html>
<html>
    <head>
        <title>CSS ogreniyorum :)</title>
        <style>
            div{
                border-style: solid;
                border-width: 5px;
            }
        #big-box{
            border-color: red;
            background-color: blue;
            width: 300px;
            height: 200px;
            z-index: 0;
        }
        #small-box{
            border-color: blue;
            background-color: red;
            width: 150px;
            height: 50px;

            position: relative;
            left: 50px;
            top: -50px;
            z-index: -1;/*z index degeri dusuk olan arkada kalir.*/
        }
        </style>
    </head>
    <body>
        <div id="big-box">
            This is my big box.
        </div>
         <div id="small-box">
            This is my small box.
        </div>
    </body>
</html>
