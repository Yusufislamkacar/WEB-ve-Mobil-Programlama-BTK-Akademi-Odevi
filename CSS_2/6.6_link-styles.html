<!DOCTYPE html>
<html>
    <head>
        <title>CSS ogreniyorum :)</title>
        <style>
            nav{
                width: 80%;
                height: 80%;
                border: powderblue solid 2px;
                background-color: papayawhip;
                border-radius: 10px;
                padding: 10px;
                margin: 20px;
                text-align: center;
            }

            a{
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                font-size: 14px;
                text-decoration: none;
            }

            a:link{
                color: green;
            }
            a:visited{
                color: purple;
            }
            a:hover{
                color: black;
                text-decoration: underline;
            }
            a:active{
                color: red;
            }
        </style>
    </head>
    <body>
        <nav>
            <a href="#">Anasayfa</a> | 
            <a href="#">Urunlerimiz</a> | 
            <a href="#">Biz Kimiz</a> | 
            <a href="#">Iletisim</a>  
        </nav>
    </body>
</html>
