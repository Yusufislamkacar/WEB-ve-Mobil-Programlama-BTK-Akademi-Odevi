<!DOCTYPE html>
<html>
    <head>
        <title>CSS ogreniyorum :)</title>
        <style>
            #box{
                border: solid pink 3px;
                width: 100px;
                height: 100px;
                overflow: hidden;/*tasmayi engelledik.*/

                border-radius: 10px;/*koseleri yuvarlattik.*/
                padding: 10px;
                box-shadow: 15px 5px 10px yellow;/*kutuya golge ekler. parametrele yatay golge dikey golge blur renk seklinde gidiyor.*/

            }
        </style>
    </head>
    <body>
        <div id="box">
            This is a box
            This is a box
            This is a box
            This is a box
            This is a box
            This is a box
        </div><!--Kutu doldu ve tasti.-->
    </body>
</html>
