<!DOCTYPE html>
<html>
    <head>
        <title>CSS ogreniyorum :)</title>
        <style>
            #box{
                /*border: solid 10px red;*//*tek satirda alttaki ozellikleri belirledik.*/
                border-style: solid;/*Kutunun kenarlari gozuktu. Varsayilan olarak none dir yani gozukmez.*/
                border-width: 5px;/*Kutu kenar kalinligini degistirdik.*/
                border-color: blue;/*Kenar rengini degistirsik.*/
            }
            #box2{
                border-style: solid dotted dashed double;/*4 kenarin sitilinide belirleyebilriz.*/
                border-width: 5px 10px 20px 30px;/*kenarlarin kalinligini ayri ayri belirledik*/
                border-color: red purple black blue;
            }
        </style>
    </head>
    <body>
        <div id="box">
            hello world, this is  a box <br>
            everything is ok? <br>
            no problem <br>
            no no
        </div>
        <div id="box2">
            hello world, this is  a box <br>
            everything is ok? <br>
            no problem <br>
            no no
        </div>
    </body>
</html>
