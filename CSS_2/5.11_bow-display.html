<!DOCTYPE html>
<html>
    <head>
        <title>CSS ogreniyorum :)</title>
        <style>
            ul{
                border-style: solid;
            }
            li{
                border: green dotted 2px;
                display: inline;/*tum satiri degil sadece bulundugu yeri isgal etti.*/
            }
            a{
                border: solid green;/*linkler sadece bulundugu alani isgal eder.*/
                display: block;/*tum satiri isgal edecek sekilde ayarladik*/
            }
        </style>
    </head>
    <body>
        <ul>
            <li>deneme</li>
            <li>dene</li>
            <li>den</li>
            <li>de</li>
        </ul>
        <a href="#">bu bir link</a>
    </body>
</html>
