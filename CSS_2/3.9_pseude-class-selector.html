<!DOCTYPE html>
<html>
    <head>
        <title>CSS ogreniyorum :)</title>
        <style>
            a{
                font-family: Verdana, Geneva, Tahoma, sans-serif;
                font-size: 16px;
            } 
            a:link{
                color: blue;
            }
            a:visited{
                color: purple;
            }
            a:hover{/*fare ustune gelince olan degisikligi saglar.*/
                color: cadetblue;
            }
            a:active{
                color: red;
            }

            #kutu{
                width: 200px;
                height: 100px;
                border:darkcyan solid 2px;
            }
            #kutu:hover{
                background-color: black;
                border: darkorchid dashed 2px;
            }
        </style>
    </head>
    <body>
        <a href="#">Anasayfa</a> <br>
        <a href="#">Ben kimim</a> <br>
        <a href="#">Portfolyo</a> <br>
        <a href="#">Iletisim</a>


        <div id="kutu">
            kutu
        </div>
    </body>
</html>
